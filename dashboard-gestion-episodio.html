<!DOCTYPE html>

<!-- DASHBOARD DE GESTIÓN - gestion de episodos -->

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rick and Morty Posting</title>
        <script src="modo-oscuro-claro.js" defer></script>
        <script src="api-episodios.js" defer></script>

        <link rel="stylesheet" href="estilos.css">
        <link rel="stylesheet" href="estilos-dashboard-episodios.css">
    </head>

    <body> <!-- Cuerpo de la pagina -->

        <div id="contenedor"> <!-- contenedor de todo el contenido de la pagina web-->
            
            <header id="marco-superior"> <!-- marco superior-->
                <h1 class="titulo-principal">Rick and Morty Posting</h1> <!-- titulo principal -->
                
                <!-- contenedor de los botones de navegación -->
                <div id="bloque-controles-navegacion">

                    <!-- boton de pagina de gestion de personajes-->
                    <div id="btn-navegar-personajes" class="control-header-item">
                        <a href="dashboard-gestion-personaje.html" class="enlace-nodo">
                            <img src="imagenes/cambio-personajes-logo.png" class="icono-control-nav" alt="Ir a Personajes">
                            <span class="subtitulo-control-nav">Personajes</span>
                        </a>
                    </div>
                    
                    <!-- boton de salir a la pagina de inicio-->
                    <div id="btn-cerrar-sesion" class="control-header-item">
                        <a href="index.html" class="enlace-nodo">
                            <img src="imagenes/salir-de-pagina-logo.png" class="icono-control-nav" alt="Salir">
                            <span class="subtitulo-control-nav">Salir</span>
                        </a>
                    </div>

                    <div id="contenedor-modo-oscuro"> <!-- boton de modo oscuro/claro -->
                        <img src="imagenes/modo-claro-logo.png" id="icono-modo-oscuro" alt="Selector de tema gráfico">
                        <span id="subtitulo-modo-oscuro">modo oscuro</span> <!-- subtitulo del boton -->
                    </div>
                </div>
            </header>
            
            <main id="main-principal">
                <!-- contenedor de titulos principales de la pagina -->
                <section id="seccion-bienvenida-dashboard" style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <h2 id="titulo-bienvenida-usuario" class="titulo-bienvenida">¡Bienvenido!</h2> <!-- Titulo principal de la pagina -->
                    <p class="subtitulo-bienvenida">Gestión de datos de la serie (Haz clic en una fila para ver su ficha)</p> <!-- subtitulo de indicacion-->
                </section>
                
                <section id="seccion-buscador-realtime"> <!-- titulo de tabla de busqueda de personaje -->
                    <label for="buscador" class="subtitulo-busqueda">Busca el episodio que desees</label>
                    <input type="text" id="buscador" placeholder="Escribe el nombre o código del episodio..." class="campo-texto-largo">
                </section>
                
                <!-- Tabla de datos de episodios -->
                 <!-- section se usa para agrupar elementos de la tabla -->
                <section id="seccion-tabla-datos"> 

                    <div id="barra-utilidades-tabla"> <!-- Barra de utilidades de la tabla -->
                        <h4 id="subtitulo-lista-datos">Lista de episodios</h4> <!-- subtitulo de la tabla -->
                        <button id="btn-ordenar-tabla" class="boton-ordenar-ovalado">Ascendente a Descendente</button> <!-- boton de ordenamiento -->
                    </div>
                    
                    <!--- contenedor de la tabla responsiva -->
                    <div class="contenedor-tabla-responsiva">
                        <table id="tabla-episodios"> 
                            <thead> <!-- tabla de episodios -->
                                <tr> 
                                    <th>ID</th> <!-- columna de elementos de la tabla o cabeza de tabla-->
                                    <th>Nombre</th>
                                    <th>Fecha de Emisión</th>
                                    <th>Código del Episodio</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-episodios"> </tbody> <!-- cuerpo de la tabla donde se insertan los datos dinámicamente con JavaScript -->
                        </table>
                    </div>
                </section>
            </main>
        </div>
        <!-- modal de ficha de episodio o ventanas apagadas para la ficha de episodio-->
        <div id="modal-ficha-episodio" class="modal-fondo modal-oculto">

            <div class="modal-contenido-ficha"><!-- tarjeta interna estructurada verticalmente según el boceto de la ficha -->
                <h3 class="titulo-ficha-centrado">Ficha de episodio</h3> <!-- titulo de la ficha-->
                
                <!-- imagen por defecto de cada episodio-->
                <img id="ficha-img" src="imagenes/images-referencia-episodios.jpg" class="img-ficha-avatar" alt="Portada del episodio"> 
                
                <div class="contenedor-botones-ficha">  <!-- contenedor de botones de control de la ficha -->
                    <button id="btn-modificar-ficha" class="btn-control-ficha">Modificar</button>
                    <button id="btn-ficha-guardar" class="btn-control-ficha">Guardar</button>
                    <button id="btn-ficha-salir" class="btn-control-ficha">Salir</button>
                </div>
                
                <!-- mensajes de error ante errores de validación -->
                <p id="mensaje-alerta-ficha" class="texto-error-oculto"></p> 
                
                <!-- contenedor de los campos de la ficha-->
                <div class="contenedor-campos-ficha"> 

                    <!-- filas de campos de la ficha -->

                    <div class="fila-campo-ficha"> <!-- fila del nombre -->
                        <label class="etiqueta-campo-ficha">Nombre:</label>
                        <input type="text" id="ficha-nombre" class="rectangulo-campo-ficha" disabled>
                    </div>
                    
                    <div class="fila-campo-ficha"> <!-- fila de fecha de emisión -->
                        <label class="etiqueta-campo-ficha">Fecha de Emisión:</label>
                        <input type="text" id="ficha-fecha" class="rectangulo-campo-ficha" disabled>
                    </div>
                    
                    <div class="fila-campo-ficha"> <!-- fila del código del episodio -->
                        <label class="etiqueta-campo-ficha">Código:</label>
                        <input type="text" id="ficha-codigo" class="rectangulo-campo-ficha" disabled>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
