<!DOCTYPE html>

<!-- PAGINA DE INICIO - Pagina de crear nueva cuenta -->

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar Clave   - Rick and Morty Posting</title>
        <link rel="stylesheet" href="estilos.css">
        <link rel="stylesheet" href="estilos-preguntas-seguridad.css">
        <link rel="stylesheet" href="estilos-recuperar-cuenta.css">
        <script src="modo-oscuro-claro.js" defer></script>
        <script src="script.js" defer></script>
    </head>

    <body> <!-- Cuerpo de la pagina -->

        <div id="contenedor"> <!-- contenedor de todo el contenido de la pagina web-->
            
            <header id="marco-superior"> <!-- marco superior-->
                <h1 class="titulo-principal">Rick and Morty Posting</h1> <!-- titulo principal -->

                <div id="contenedor-modo-oscuro"> <!-- boton de modo oscuro/claro -->
                    <img src="imagenes/modo-claro-logo.png" id="icono-modo-oscuro" alt="Selector de tema gráfico">
                    <span id="subtitulo-modo-oscuro">modo oscuro</span> <!-- subtitulo del boton -->
                </div>
            </header>

            <main id="main-principal">  <!-- Contenido principal de la pagina -->
                <div id="cuadro-de-login"> <!-- Cuadro de recuperación de contraseña con formulario-->
                    <h3 class="titulo-login">Recuperar Contraseña</h3> <!-- titulo del cuadro -->
                    
                    <form id="form-recuperar-nombre" class="caja-campos-recuperar"> <!-- formulario para registrar el usuario  -->

                        <div class="grupo-entrada"> <!-- campo de nombre del usuario  -->
                            <label class="etiqueta-campo">Nombre completo del usuario:</label>
                            <input type="text" id="recuperar-nombre" class="campo-texto" placeholder="Ej. Rick Sanchez" required>
                        </div>
                        
                        <!-- mensaje de error ante usuario inexistente -->
                        <p id="error-rec-nombre" class="texto-error-oculto"></p> 
                        
                        <!-- boton de continuar con le procedimiento-->
                        <div class="contenedor-boton-principal margen-boton-recuperar">
                            <button type="submit" class="boton-ingresar">Continuar</button>
                        </div>
                    </form>
                    
                    <!-- regresar a la pantalla de inicion de sesion-->
                    <div id="contenedor-botones-secundarios">
                        <a href="index.html" class="boton-secundario">Cerrar</a>
                    </div>
                </div>
                
                <!-- ventana de pregruntas o modal para preguntas de seguridad -->
                <div id="modal-preguntas" class="modal-fondo modal-oculto">
                    <!-- contenedor del modal -->
                    <div class="modal-contenido">
                        <h3 class="titulo-login">Preguntas de Seguridad</h3> <!-- titulo del modal -->
                        
                        <!-- formulario para las preguntas de seguridad -->
                        <form id="form-modal-preguntas" class="caja-campos-recuperar"> 
                            <div class="grupo-entrada"> <!-- campo de respuesta a pregunta 1 -->
                                <label id="modal-label-p1" class="etiqueta-campo">Pregunta 1</label>
                                <input type="text" id="modal-resp1" class="campo-texto" required>
                            </div>
                            <div class="grupo-entrada"> <!-- campo de respuesta a pregunta 2 -->
                                <label id="modal-label-p2" class="etiqueta-campo">Pregunta 2</label>
                                <input type="text" id="modal-resp2" class="campo-texto" required>
                            </div>
                            <div class="grupo-entrada"> <!-- campo de respuesta a pregunta 3 -->
                                <label id="modal-label-p3" class="etiqueta-campo">Pregunta 3</label>
                                <input type="text" id="modal-resp3" class="campo-texto" required>
                            </div>
                            
                            <!-- mensaje de error para las preguntas de seguridad -->
                            <p id="error-modal-preguntas" class="texto-error-oculto"></p>
                            
                            <!-- boton de confirmar las respuestas-->
                            <div class="contenedor-boton-principal">
                                <button type="submit" class="boton-ingresar">Confirmar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

    </body>
</html>
